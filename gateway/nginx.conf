server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_host backend;
        proxy_set_header Host $http_host;
        proxy_pass http://$backend_host:8000/api/;
    }

    location /admin/ {
        set $backend_host backend;
        proxy_set_header Host $http_host;
        proxy_pass http://$backend_host:8000/admin/;
    }

    location / {
        alias /staticfiles/;
        index index.html;
    }
}
